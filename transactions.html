<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker - Transactions</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>

<div class="app">


    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="brand">
            Expense <span>Tracker</span>
        </div>


        <nav class="nav">

            <a href="dashboard.html">
                ▦ Dashboard
            </a>

            <a
                href="transactions.html"
                class="active">

                ☷ Transactions

            </a>

            <a href="add-expense.html">
                ⊕ Add Expense
            </a>

            <a href="categories.html">
                ◈ Categories
            </a>

            <a href="settings.html">
                ⚙ Settings
            </a>

        </nav>


        <div class="sidebar-bottom">

            <div class="theme-row">

                <span>Dark Mode</span>

                <button
                    id="themeToggle"
                    class="switch">
                </button>

            </div>

            <small>
                Personal finance dashboard
            </small>

        </div>

    </aside>


    <!-- MAIN -->
    <main class="main">


        <header class="topbar">

            <div class="title">

                <h1>
                    Transactions
                </h1>

                <p>
                    View and manage your income and expenses
                </p>

            </div>


            <button
                id="addTransactionBtn"
                class="primary">

                + Add Transaction

            </button>

        </header>


        <!-- TABLE -->
        <div class="card">

            <table class="table">

                <thead>

                    <tr>

                        <th>
                            Title
                        </th>

                        <th>
                            Category
                        </th>

                        <th>
                            Date
                        </th>

                        <th>
                            Type
                        </th>

                        <th>
                            Amount
                        </th>

                        <th>
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="transactionRows">
                </tbody>

            </table>


            <div
                id="empty"
                class="empty"
                hidden>

                No transactions yet.

            </div>

        </div>

    </main>

</div>


<div
    id="toast"
    class="toast">
</div>


<script src="app.js"></script>

</body>
</html>
